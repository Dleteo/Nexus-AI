name: Prepare cropped ethical hacking certificate

on:
  push:
    branches:
      - fix/ethical-hacking-certificate-clean-image
    paths:
      - scripts/crop_ethical_hacking.py
      - .github/workflows/prepare-ethical-hacking.yml

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install imaging library
        run: python -m pip install Pillow==11.3.0
      - name: Crop from the authentic certificate
        run: python scripts/crop_ethical_hacking.py
      - name: Save cropped image in pull request branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/certificates/ethical-hacking.webp
          if ! git diff --cached --quiet; then
            git commit -m "Add cropped original ethical hacking certificate image"
            git push origin HEAD:fix/ethical-hacking-certificate-clean-image
          fi
